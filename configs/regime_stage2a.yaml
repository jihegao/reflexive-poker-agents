stage2a_calibration:
  protocol: regime-stage2a-calibration-v1
  claim_boundary: bounded_calibration_no_live_llm
  seed_start: 12000
  seed_count: 12
  hands: 400
  switch_hand: 160
  equity_samples: 2
  simulation_rollouts: 240
  simulation_equity_samples: 1
  policy_holdout_hands: 600
  noise_levels: [0.05, 0.15]
  detector:
    reference_size: 64
    recent_size: 40
    min_recent_observations: 28
    likelihood_ratio_threshold: 6.0
    min_probability_delta: 0.08
    required_streak: 4
    evaluation_stride: 4
    calibration_observations: 64
    probe_direction_delta: 0.08
    earliest_detection_hand: 128
  selector:
