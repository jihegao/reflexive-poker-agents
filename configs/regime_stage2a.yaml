    minimum_improvement_bb_per_hand: 0.0
    probe_open_raise_minimum: 0.28
    probe_fold_minimum: 0.52
    probe_reraise_maximum: 0.22
  gates:
    detection_rate: 0.70
    median_delay_hands: 24
    no_switch_false_positive_rate: 0.10
    pressure_selection_rate: 0.80
    reflection_action_divergence: 0.01
  worlds:
