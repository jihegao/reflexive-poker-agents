      open_raise_probability: 0.18
      fold_vs_bet_probability: 0.42
      reraise_probability: 0.10
    switch:
      open_raise_probability: 0.38
      fold_vs_bet_probability: 0.62
      reraise_probability: 0.10
    policy_holdouts:
      holdout_probe_fold_low:
        open_raise_probability: 0.34
        fold_vs_bet_probability: 0.58
        reraise_probability: 0.12
      holdout_probe_fold_high:
        open_raise_probability: 0.42
        fold_vs_bet_probability: 0.66
        reraise_probability: 0.08
    proxy_hypotheses:
      proxy_probe_fold_low:
        open_raise_probability: 0.34
        fold_vs_bet_probability: 0.58
        reraise_probability: 0.12
        prior: 1.0
      proxy_probe_fold_high:
        open_raise_probability: 0.42
        fold_vs_bet_probability: 0.66
        reraise_probability: 0.08
        prior: 1.0
      proxy_bluff_heavy_distractor:
        open_raise_probability: 0.42
        fold_vs_bet_probability: 0.24
        reraise_probability: 0.32
        prior: 0.5
