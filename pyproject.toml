[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexive-poker-agents"
version = "0.3.0"
description = "A reproducible multi-agent poker testbed for situated self-models, social observation feedback, and adaptive reasoning depth."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Jihe Gao", email = "jihe.gao@gmail.com"},
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
reflexive-poker = "reflexive_poker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
