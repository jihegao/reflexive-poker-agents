[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexive-poker-agents"
version = "0.5.0"
description = "A reproducible multi-agent poker testbed for situated self-models, social observation feedback, and adaptive reasoning depth."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Jihe Gao", email = "jihe.gao@gmail.com"},
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "tabulate>=0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
  "openai>=2.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]
dev = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
reflexive-poker = "reflexive_poker.cli:main"
reflexive-poker-demo = "reflexive_poker.demo_api:main"
expctl = "reflexive_poker.expctl:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
